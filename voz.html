<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ODIN CONTROL — Voz</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0d10;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:24px;
}

.container{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:0 auto 22px;
  border:1px solid #555;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

p{
  color:#aaa;
  line-height:1.5;
  margin:0 0 28px;
}

button{
  width:100%;
  min-height:62px;
  border:0;
  border-radius:18px;
  background:#f1f1f1;
  color:#111;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

button.ouvindo{
  background:#9b1c1c;
  color:white;
}

.status{
  margin-top:22px;
  min-height:50px;
  color:#aaa;
  line-height:1.4;
}

.transcricao{
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:#15181d;
  min-height:80px;
  text-align:left;
  word-break:break-word;
  color:#fff;
}

.voltar{
  display:block;
  margin-top:22px;
  color:#aaa;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">◉</div>

  <h1>ODIN CONTROL</h1>

  <p>
    Fale seu comando financeiro naturalmente.
  </p>

  <button id="btnVoz" onclick="iniciarVoz()">
    🎙 Falar com ODIN
  </button>

  <div id="status" class="status">
    Toque no botão e fale.
  </div>

  <div id="transcricao" class="transcricao">
    Aguardando comando...
  </div>

  <a href="#" class="voltar" onclick="voltarODIN();return false;">
    ← Voltar para o ODIN
  </a>

</div>

<script>

let reconhecimento = null;
let ouvindo = false;
let textoFinal = '';

const btn = document.getElementById('btnVoz');
const status = document.getElementById('status');
const transcricao = document.getElementById('transcricao');

function iniciarVoz(){

  if(ouvindo){
    pararVoz();
    return;
  }

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    status.textContent =
      'O reconhecimento de voz não está disponível neste navegador.';

    return;
  }

  try{

    reconhecimento = new SR();

    reconhecimento.lang = 'pt-BR';
    reconhecimento.continuous = false;
    reconhecimento.interimResults = true;
    reconhecimento.maxAlternatives = 1;

    textoFinal = '';
    ouvindo = true;

    btn.classList.add('ouvindo');
    btn.textContent = '■ Parar de ouvir';

    status.textContent =
      'Ouvindo… fale seu comando agora.';

    transcricao.textContent = '';

    reconhecimento.onresult = function(event){

      let parcial = '';

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const texto =
          event.results[i][0].transcript;

        if(event.results[i].isFinal){

          textoFinal += texto + ' ';

        }else{

          parcial += texto;

        }
      }

      const resultado =
        (textoFinal + parcial).trim();

      transcricao.textContent =
        resultado || 'Ouvindo...';
    };

    reconhecimento.onerror = function(event){

      ouvindo = false;

      btn.classList.remove('ouvindo');
      btn.textContent = '🎙 Falar com ODIN';

      if(event.error === 'not-allowed'){

        status.textContent =
          'O acesso ao microfone foi bloqueado. Autorize o microfone para esta página.';

      }else if(event.error === 'no-speech'){

        status.textContent =
          'Nenhuma fala foi detectada. Tente novamente.';

      }else{

        status.textContent =
          'Não foi possível capturar a voz. Tente novamente.';
      }

    };

    reconhecimento.onend = function(){

      ouvindo = false;

      btn.classList.remove('ouvindo');
      btn.textContent = '🎙 Falar com ODIN';

      const texto =
        textoFinal.trim();

      if(texto){

        status.textContent =
          'Comando capturado. Enviando para o ODIN…';

        enviarParaODIN(texto);

      }else{

        status.textContent =
          'Nenhum comando foi capturado.';
      }

      reconhecimento = null;
    };

    reconhecimento.start();

  }catch(error){

    ouvindo = false;

    btn.classList.remove('ouvindo');
    btn.textContent = '🎙 Falar com ODIN';

    status.textContent =
      'O navegador não conseguiu iniciar o microfone.';
  }
}


function pararVoz(){

  if(reconhecimento){

    try{
      reconhecimento.stop();
    }catch(e){}

  }

  ouvindo = false;

  btn.classList.remove('ouvindo');
  btn.textContent = '🎙 Falar com ODIN';
}


function enviarParaODIN(texto){

  if(!window.opener){

    status.textContent =
      'O ODIN CONTROL não está aberto. Volte ao painel e tente novamente.';

    return;
  }

  window.opener.postMessage(
    {
      type:'ODIN_VOICE_RESULT',
      text:texto
    },
    '*'
  );

  status.textContent =
    'Registrado no ODIN.';

  transcricao.textContent =
    texto;

  setTimeout(function(){

    try{
      window.close();
    }catch(e){}

  },700);
}


function voltarODIN(){

  window.location.href =
    'https://script.google.com/macros/s/AKfycbx9s_8qRcc-CLEmC2aCUsvRbGDbsswHJKseMZp2Bis24aBVyteJCPz8lpAzVWwJogD4/exec';

}
</script>

</body>
</html>
